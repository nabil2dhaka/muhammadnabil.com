    body {

    .modal-content {

      border: 1px solid var(--velixo-border);

    .modal-footer {

    .dark-theme .btn-close {

    }

    /* Immediate visibility for scroll reveal elements */
    .scroll-reveal, .scroll-reveal-left, .scroll-reveal-right {
      opacity: 1 !important;
      transform: none !important;
    }

    /* Avatar styling */
    .avatar-box img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    .bento-card {
      opacity: 1 !important;
    }

    /* Contact Card polish */
    .contact-item-card {
      min-height: 160px;
      padding: 30px 20px;
      border-radius: var(--radius-xl);
      text-align: center;
      background-color: var(--velixo-card);
      border: 1px solid var(--velixo-border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: var(--velixo-transition);
    }
    .contact-item-card:hover {
      border-color: var(--velixo-primary);
      box-shadow: 0 20px 40px -15px rgba(var(--velixo-primary-rgb), 0.18);
      transform: translateY(-5px);
    }
    .contact-item-card .contact-icon {
      font-size: 24px;
      color: var(--velixo-primary);
      margin-bottom: 10px;
      line-height: 1;
    }
    .contact-item-card .contact-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      opacity: 0.5;
      margin-bottom: 6px;
      letter-spacing: 1px;
      color: var(--velixo-text);
    }
    .contact-item-card .contact-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--velixo-text);
      word-break: break-all;
    }

    /* Buttons */
    .btn-vx-primary {

      border-color: var(--velixo-primary);
      color: #ffffff;
      border-radius: 9999px;
      padding: 16px 42px;
      font-size: 13px;
      letter-spacing: 1px;
      font-weight: 800;
      text-transform: uppercase;
      box-shadow: 0 10px 25px -4px rgba(var(--velixo-primary-rgb), 0.4);
      transition: var(--velixo-transition);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-vx-primary:hover {
      background-color: #155cb8;
      border-color: #155cb8;
      color: #ffffff;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 16px 32px -4px rgba(var(--velixo-primary-rgb), 0.55);
    }

    .btn-vx-outline {
      background-color: transparent;
      border: 1.5px solid var(--velixo-text);
      color: var(--velixo-text);
      border-radius: 9999px;
      padding: 16px 42px;
      font-size: 13px;
      letter-spacing: 1px;
      font-weight: 800;
      text-transform: uppercase;
      transition: var(--velixo-transition);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-vx-outline:hover {
      background-color: var(--velixo-text);
      border-color: var(--velixo-text);
      color: var(--velixo-card);
      transform: translateY(-3px) scale(1.02);
    }
    html.dark-theme .btn-vx-outline {
      border-color: rgba(255, 255, 255, 0.4);

    }
    html.dark-theme .btn-vx-outline:hover {
      background-color: #ffffff;
      border-color: #ffffff;
      color: #0a0f1a;
    }
  </style>

  <!-- Interactive JavaScript: Theme Switcher & Reveal Observer -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const darkToggle = document.querySelector('.dark-toggle');
      const themeIcon = darkToggle ? darkToggle.querySelector('i') : null;

      function syncThemeIcon() {
        if (!themeIcon) return;
        const isDark = document.documentElement.classList.contains('dark-theme');
        if (isDark) {
          themeIcon.className = 'fa-solid fa-sun';
        } else {
          themeIcon.className = 'fa-solid fa-moon';
        }
      }

      syncThemeIcon();

      if (darkToggle) {
        darkToggle.addEventListener('click', function () {
          const isDark = document.documentElement.classList.toggle('dark-theme');
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
          syncThemeIcon();
        });
      }

      document.querySelectorAll('.scroll-reveal, .scroll-reveal-left, .scroll-reveal-right').forEach(function(el) {
        el.classList.add('revealed');
      });
    });
  </script>
